# Container-only HTTP. The cloud ingress must terminate HTTPS for PUBLIC_URL.
daemon off;
pid /tmp/marketradar-nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    client_max_body_size 2m;
    client_body_temp_path /tmp/marketradar-client;
    proxy_temp_path /tmp/marketradar-proxy;
    fastcgi_temp_path /tmp/marketradar-fastcgi;
    uwsgi_temp_path /tmp/marketradar-uwsgi;
    scgi_temp_path /tmp/marketradar-scgi;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    server {
        listen 8080;
        server_name _;

        location = /_browser_auth {
            internal;
            proxy_pass http://127.0.0.1:8877/api/cloud/browser-auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $http_host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Origin $http_origin;
        }

        location = /browser/websockify {
            auth_request /_browser_auth;
            proxy_pass http://127.0.0.1:6080/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /browser/ {
            auth_request /_browser_auth;
            alias /usr/share/novnc/;
            index vnc.html;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer" always;
        }

        location / {
            proxy_pass http://127.0.0.1:8877;
            proxy_set_header Host $http_host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 120s;
        }
    }
}
